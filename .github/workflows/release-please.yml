name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Hourly self-heal backstop: the built-in GITHUB_TOKEN suppresses the push
  # event caused by the Release PR's auto-merge, so this tick picks up any
  # merged-but-untagged release within the hour.
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Do NOT swap this for a fine-grained PAT (e.g. RELEASE_PLEASE_TOKEN):
          # doing so reproducibly breaks release-please with "Error adding to tree".
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please generates its own PR title, which the PR-title linter does
      # not run on. Post a synthetic passing check-run so branch protection that
      # requires "Lint PR title" does not block the Release PR.
      - name: Report lint-pr-title check on Release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          head_branch=$(echo "$RELEASE_PR" | jq -r '.headBranchName')
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_branch}" --jq '.sha')
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -X POST \
            -f name='Lint PR title' \
            -f head_sha="$head_sha" \
            -f status='completed' \
            -f conclusion='success' \
            -f 'output[title]=Release PR title is generated by release-please' \
            -f 'output[summary]=Conventional Commits lint is not applicable to release-please auto-generated PR titles.'
